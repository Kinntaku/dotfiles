# environment
env=QT_QPA_PLATFORMTHEME,qt6ct
env=DOTFILES,/home/kinntaku/user_dotfiles

# input
numlockon=1
mouse_natural_scrolling=0
trackpad_natural_scrolling=1

# monitor
monitorrule=name:^DP-4$,width:1920,height:1080,refresh:165.003006,x:0,y:0
monitorrule=name:^eDP-1$,width:2560,height:1600,scale:1.5,refresh:165.002,x:0,y:1080

# autostart
# exec-once=kanshi
exec-once=flclash
exec-once=waybar -c ~/.config/waybar/mango_config.jsonc
exec-once=fcitx5
exec-once=mako
# exec-once=swayidle -w before-sleep "swaylock -f"
exec-once=swayidle -w before-sleep "wlr-randr --output DP-4 --off; wlr-randr --output eDP-4 --on; swaylock -f" after-resume "sleep 2 && wlr-randr --output DP-4 --on"
# exec-once=swayidle -w before-sleep "kanshi switch sleep; sleep 1; swaylock -f" after-resume "pkill -HUP kanshi"
exec-once=awww-daemon
exec-once=blueman-applet
exec-once=nm-applet
exec-once=copyq --start-server
exec-once=xrdb -merge ~/.Xresources
exec-once=lxqt-policykit-agent
# exec-once=mmsg dispatch create_virtual_output
exec-once=bash -c "sleep 2 && rog-control-center"

# ipc
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=none,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=none,XF86AudioPlay,spawn,playerctl play-pause
bind=none,XF86AudioPrev,spawn,playerctl previous
bind=none,XF86AudioNext,spawn,playerctl next
bind=none,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +10%
bind=none,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 10%-

# custome application
bind=super,Grave,spawn,fuzzel
bind=super,v,spawn,copyq toggle
bind=super,x,spawn,$DOTFILES/scripts/power.sh
bind=super,l,spawn,swaylock
bind=super+ctrl,v,spawn,pavucontrol
bind=none,XF86Launch3,spawn,rog-control-center
bind=none,XF86Calculator,spawn,qalculate-qt
bind=none,XF86TouchpadToggle,spawn,$DOTFILES/scripts/touchpad_toggle.sh
bind=ctrl+shift,Escape,spawn,kitty htop
bind=alt,space,spawn,kitty --class=navi-window -e navi --path $DOTFILES/navi
bind=super,t,spawn,kitty
bind=super,e,spawn,thunar
bind=super,f1,spawn,wlr-randr --output eDP-1 --toggle
bind=super,f2,spawn,ddcutil setvcp 10 - 10
bind=super,f3,spawn,ddcutil setvcp 10 + 10

bind=super,q,spawn,bash -c "grim -g \"$(slurp)\" - | copyq write image/png -"
bind=NONE,Print,spawn_shell, bash -c "grim - | copyq write image/png -"
bind=super+shift,q,spawn,bash -c "copyq read image/png 0 | satty --default-hide-toolbars --filename - "

# 配置文件管理与退出
bind=super,r,reload_config
bind=alt,F4,killclient
bind=super,c,centerwin
bind=super,f, switch_proportion_preset
bind=super+shift,f, togglefloating
bind=none,f11, togglefullscreen

scroller_default_proportion=0.5
scroller_proportion_preset=0.5,1.0
exchange_cross_monitor=1
tag_animation_direction=0
sloppyfocus=0
warpcursor=0
drag_tile_to_tile=1
syncobj_enable=1
borderpx=4
gappih=2
gappiv=2
gappoh=2
gappov=2

bind=super,a,focusdir,left
bind=super,d,focusdir,right
bind=super+shift,a,exchange_client,left
bind=super+shift,d,exchange_client,right

bind=super,w,viewtoleft
bind=super,s,viewtoright
bind=super+shift,w,tagtoleft
bind=super+shift,s,tagtoright

tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller
bind=super,1,view,1
bind=super,2,view,2
bind=super,3,view,3
bind=super,4,view,4
bind=super,5,view,5
bind=super,6,view,6
bind=super,7,view,7
bind=super,8,view,8
bind=super,9,view,9
bind=super+shift,1,tag,1
bind=super+shift,2,tag,2
bind=super+shift,3,tag,3
bind=super+shift,4,tag,4
bind=super+shift,5,tag,5
bind=super+shift,6,tag,6
bind=super+shift,7,tag,7
bind=super+shift,8,tag,8
bind=super+shift,9,tag,9

bind=super,up,focusmon,up
bind=super,down,focusmon,down
bind=super,left,focusmon,left
bind=super,right,focusmon,right

bind=super+ctrl,a,scroller_stack,left
bind=super+ctrl,d,scroller_stack,right
bind=super+ctrl,w,scroller_stack,up
bind=super+ctrl,s,scroller_stack,down

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

windowrule = isnoanimation:1,isfloating:1, title:^wps$
windowrule = isnoanimation:1,isfloating:1, title:^et$
windowrule = isnoanimation:1,isfloating:1, title:^wpp$
windowrule = isfloating:0, appid:Xephyr
windowrule = isfloating:1, appid:copyq
windowrule = isfloating:1, appid:satty
windowrule = isfloating:1, appid:navi-window
windowrule = isfloating:1, appid:lxqt-policykit-agent
windowrule = isfloating:1, appid:org.pulseaudio.pavucontrol
windowrule = focused_opacity:0.9,unfocused_opacity:0.9,appid:kitty

# animation
animation_duration_move=250
animation_duration_open=250
animation_duration_tag=250
animation_duration_close=250
animation_duration_focus=0


